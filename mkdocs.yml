site_name: pretix plugins
site_description: Portuguese payment and invoicing plugins for pretix
site_author: Afonso Santos
site_url: https://docs.afonsosantos.me/
repo_url: https://github.com/afonsosantos/pretix-plugins-docs
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Afonso Santos — Apache License 2.0

# Fail `--strict` builds on links to headings that don't exist, not just missing pages.
validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Portuguese pages sit next to the English ones as <page>.pt.md; a page with no .pt.md
  # falls back to English.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
        - locale: pt
          name: Português
          site_description: Plugins de pagamento e faturação portugueses para o pretix
          nav_translations:
            Home: Início
            Configuration: Configuração
            Webhooks & refunds: Webhooks e reembolsos
            PT invoicing: Faturação PT
            Providers: Fornecedores
            Writing a provider: Criar um fornecedor
            Issuing & credit notes: Emissão e notas de crédito
            Known limitations: Limitações conhecidas
            Troubleshooting: Resolução de problemas
            Development: Desenvolvimento

nav:
  - Home: index.md
  - euPago:
      - eupago/index.md
      - Configuration: eupago/configuration.md
      - Webhooks & refunds: eupago/webhooks.md
  - PT invoicing:
      - pt-invoicing/index.md
      - Configuration: pt-invoicing/configuration.md
      - Providers:
          - Fact.pt: pt-invoicing/factpt.md
          - Moloni: pt-invoicing/moloni.md
          - Writing a provider: pt-invoicing/providers.md
      - Issuing & credit notes: pt-invoicing/usage.md
      - Known limitations: pt-invoicing/limitations.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
